version: '3.9'

services:
  atlas-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-osint-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=sqlite:///./atlas_osint.db
    volumes:
      - ./backend:/app
      - ./config/secrets.env:/app/config/secrets.env
    command: python -m app.main

  atlas-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas-osint-frontend
    ports:
      - "3000:3000"
    depends_on:
      - atlas-backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  data:
